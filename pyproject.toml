# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qpriviot-fl"
version = "1.0.0"
description = ""
license = "Apache-2.0"
# Dependencies for your Flower App
dependencies = [
    "flwr[simulation]>=1.22.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "opacus",
    "flwr-datasets",
    "psutil",
    "matplotlib",
    "numpy",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "opacus"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "nikms"

# Point to your ServerApp and ClientApp objects
[tool.flwr.app.components]
serverapp = "qpriviot_fl.server_app:app"
clientapp = "qpriviot_fl.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 50
fraction-fit = 0.8
fraction-evaluate = 0.5
min-fit-clients = 3
min-available-clients = 3
batch-size = 32
local-epochs = 5
learning-rate = 0.05
dataset = "cifar10"
num-shares = 3
reconstruction-threshold = 2
max-weight = 10000
use-secagg = false
use-dp = false
use-adaptive-dp = false
target-epsilon = 12.0
base-noise = 0.3
seed = 1337
dirichlet-alpha = 0.3
results-file = "results.json"

# Default federation to use when running the app
[tool.flwr.federations]
default = "local-simulation"

# Local simulation federation with 10 virtual SuperNodes
[tool.flwr.federations.local-simulation]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.0

# Remote federation example for use with SuperLink
[tool.flwr.federations.remote-federation]
address = "<SUPERLINK-ADDRESS>:<PORT>"
insecure = true  # Remove this line to enable TLS
# root-certificates = "<PATH/TO/ca.crt>"  # For TLS setup
